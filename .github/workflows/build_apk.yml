name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.34

      - name: Pre-clone python-for-android from Gitee (no proxy needed)
        run: |
          # 关键：直接克隆 Gitee 镜像到 Buildozer 期望的精确路径
          # 这样 Buildozer 检测到目录已存在就不会再去 GitHub 克隆
          mkdir -p .buildozer/android/platform/
          rm -rf .buildozer/android/platform/python-for-android
          git clone --depth 1 -b master https://gitee.com/mirrors/python-for-android.git \
            .buildozer/android/platform/python-for-android

      - name: Build APK
        run: |
          # 关键：把 JDK 17 的 bin 放到 PATH 最前面，彻底覆盖系统默认的 JDK 11
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          javac -version
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muscle-tracker-apk
          path: bin/*.apk
          retention-days: 30
